<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
</head>
<body>
    <h2>Sign Up</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign Up</button>
    </form>
    <div class="signup-link">
      <a href="{% url 'accounts:login' %}">{% translate "Don't have an account? Register" %}</a>
      </div>
</body>
</html>
