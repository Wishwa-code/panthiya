{% spaceless %}{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1"  />

        <title>{% block title %}Auctions{% endblock %}</title>

        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
        <link href="{% static 'videochat/layout.css' %}" rel="stylesheet">
        <link href="{% static 'videochat/sidenav.css' %}" rel="stylesheet">



        <script src="https://kit.fontawesome.com/8056cc3b3e.js" crossorigin="anonymous"></script>
        <script crossorigin src="https://cdn.jsdelivr.net/npm/peerjs@1.3.2/dist/peerjs.min.js"></script>
        <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
        <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>   
        <script crossorigin src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/moment/moment.min.js"></script>
        <script src="https://cdn.agora.io/sdk/release/AgoraRTC_N.js"></script>


        {% block style %}
        {% endblock %}

        {% block script %}
        {% endblock %}
    </head>
    <body>
        


        <div id="void-container">
            <div id="side-navigation-bar" class="navbar">
                <div class="profile-section">
                    <img class="profile-pic" width="100" height="100" src={{profile.photo.url}} alt="User" />
                    <p class="user-name">{{profile.user.username}}</p>
                </div>
                <!-- {console.log(user)} -->
                <div class="top_bar_nav">
                    <div class="nav-item">
                        <a href="/" class="nav-link">
                            <i class='fa-duotone fa-solid fa-chalkboard-user nav-bar-icons'></i>
                            Classes</a>
                    </div>
                    <div class="nav-item">
                        <a href="/chats/" class="nav-link">
                            <i class='fa-duotone fa-solid fa-comments nav-bar-icons'></i>
                            Freinds</a>
                    </div>
                    
                </div>

                <!-- {# CTA Button #} -->
                <a href="/create/" class="create-button">Create a Classroom</a>


                <!-- {/* Bottom Settings */} -->
                <div class="bottom-options">
                    <div class="option-item">
                        <span className="icon">⚙️</span> 
                        Settings
                    </div>
                    <a href="{% url 'accounts:logout' %}" class="option-item" >
                        <span className="icon">🪵➡️</span> 
                        Logout
                    </a>
                </div>
            </div>
                {% block body %}
                {% endblock %}

        </div>
    </body>
</html>
{% endspaceless %}
