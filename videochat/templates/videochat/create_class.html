{% extends "videochat/layout.html" %}

{% block body %}

    <h2>Create class</h2>

    {% if message %}
        <div>{{ message }}</div>
    {% endif %}

    <form action="{% url 'createClass' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <input id="class-name" autofocus class="form-control" type="text" name="classname" placeholder="Class name">
        </div>

        <div class="form-group">
            <input id="create-class-form-subject" autofocus class="form-control" type="text" name="subject" placeholder="Subject">
        </div>
        <div class="form-group">
            <input id="create-class-form-grade" autofocus class="form-control" type="text" name="subject" placeholder="Grade">
        </div>
        <div class="form-group">
            <input id="create-class-form-description" autofocus class="form-control" type="text" name="description" placeholder="description">
        </div>
        <div class="form-group">   
            <label for="thumbnail">Thumbnail Image:</label>
            <input type="file" class="form-control-file" id="thumbnail" name="thumbnail">
        </div>
        <input id="create-class-form-create-class-button" class="btn btn-primary" type="submit" value="Create Class">
    </form>

    <a href="{% url 'index' %}">Go back</a>

{% endblock %}
